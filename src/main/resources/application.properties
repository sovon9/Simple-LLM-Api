spring.application.name=Simple-LLM-Api

# 1. Explicitly activate Google GenAI as your active models
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai

# 2. Guarantee the embedding autoconfiguration runs
spring.ai.google.genai.embedding.enabled=true

spring.ai.google.genai.api-key=${ANTHROPIC_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
#spring.ai.google.genai.embedding.project-id=gen-lang-client-0718726642
spring.ai.google.genai.embedding.api-key=${ANTHROPIC_API_KEY}
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

#DB config
spring.datasource.url=jdbc:mysql://localhost:3308/dev
spring.datasource.username=sovon9
spring.datasource.password=password

spring.jpa.show-sql=true

# to create the table always
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# initialize the schema on startup
spring.ai.vectorstore.qdrant.initialize-schema=true

spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334

spring.ai.vectorstore.qdrant.collection-name=HR

spring.docker.compose.stop.command=down